# Each extension is its own package. Listed by glob; directories without a
# package.json (extensions/shared, extensions/workflows) are not packages and
# are skipped.
packages:
  - "extensions/*"
# Pi runs without these install scripts; msgpackr-extract has a pure-JS
# fallback. Declining them explicitly keeps pnpm 12 from failing the install.
allowBuilds:
  '@google/genai': false
  msgpackr-extract: false
  protobufjs: false
